name: Build & Publish Android

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to publish to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      publish:
        description: 'Upload the AAB to Google Play'
        required: true
        default: true
        type: boolean
      debug:
        description: 'Log all environment variables (for debugging)'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main

jobs:
  build-and-publish:
    environment:
      name: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Log all environment variables
        if: github.event_name == 'workflow_dispatch' && format('{0}', github.event.inputs.debug) == 'true'
        shell: bash
        run: env | sort

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set" && exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d ' \r\n' | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-loyaltywallet}"
            echo "keyPassword=${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
          } > android/keystore.properties

      - name: Verify signing keystore
        shell: bash
        run: |
          ALIAS=$(grep keyAlias android/keystore.properties | cut -d= -f2)
          PASSWORD=$(grep storePassword android/keystore.properties | cut -d= -f2)
          if ! keytool -list -keystore android/app/release.keystore \
              -storetype PKCS12 -storepass "${PASSWORD}" -alias "${ALIAS}" > /dev/null 2>&1; then
            echo "::error::Decoded keystore is corrupt or the KEYSTORE_PASSWORD/KEY_ALIAS secrets are wrong."
            echo "Regenerate ANDROID_KEYSTORE_BASE64 with: base64 -i android/app/release.keystore | tr -d '\\n' | pbcopy"
            exit 1
          fi
          echo "Keystore verified: alias=${ALIAS}"

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: loyaltywallet-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        if: format('{0}', github.event.inputs.publish) == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: za.co.entuit.loyaltywallet
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
